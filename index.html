<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Summon & Chat</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="stylesheet" href="style.css?v=1.30" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
</head>
<body>
  <!-- Top Bar -->
  <header class="topbar">
    <div class="user-badge" id="currentUserBadge">
      <span class="status-dot"></span>
      <span id="currentUserName">Loading...</span>
    </div>
    <div class="header-actions" style="display: flex; align-items: center; gap: 6px;">
      <button id="forceUpdateBtn" title="Tap to check for updates" style="font-size: 0.72rem; color: #4f46e5; font-weight: 700; background: #e0e7ff; padding: 4px 8px; border-radius: 10px; border: 1px solid #c7d2fe; cursor: pointer;">
        v1.30 ⟳
      </button>
      <button id="switchUserBtn" class="pill-btn secondary">Switch</button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="nav-tabs">
    <button class="tab active" data-tab="alertTab">⚡ Summon</button>
    <button class="tab" data-tab="chatTab">💬 Chat</button>
    <button class="tab" data-tab="debugTab">🐞 Debug</button>
  </nav>

  <!-- MAIN TAB: SUMMON / INSTANT ALERT -->
  <main id="alertTab" class="view-panel active">
    <section class="card hero-card">
      <h2>Summon Downstairs</h2>
      <p class="subtitle">Broadcasts an instant loud notification to her phone via ntfy.</p>

      <div class="preset-chips">
        <button class="chip" data-msg="Dinner is ready! Come downstairs 🍲">🍲 Dinner</button>
        <button class="chip" data-msg="Package arrived for you downstairs 📦">📦 Package</button>
        <button class="chip" data-msg="Need you downstairs right now! 🏃‍♀️">🏃 Urgent</button>
        <button class="chip" data-msg="Family movie / snacks time! 🍿">🍿 Movie</button>
      </div>

      <div class="form-group">
        <label for="alertInput">Custom Message</label>
        <textarea id="alertInput" rows="3" placeholder="e.g. Come downstairs, dinner is served!"></textarea>
      </div>

      <div class="priority-selector">
        <label for="alertPriority">Urgency Level:</label>
        <select id="alertPriority">
          <option value="default">Normal (Buzz)</option>
          <option value="high" selected>High (Loud)</option>
          <option value="urgent">Max Urgent (Emergency sound)</option>
        </select>
      </div>

      <button id="sendAlertBtn" class="primary-btn">
        <span>Send Instant Alert</span> 🚀
      </button>

      <div id="alertStatus" class="status-msg"></div>
    </section>
  </main>

  <!-- CHAT TAB: MESSAGING -->
  <section id="chatTab" class="view-panel">
    <div class="chat-container">
      <div class="messages-list" id="messagesList">
        <div class="chat-placeholder" style="text-align: center; color: #94a3b8; margin-top: 20px; font-size: 0.9rem;">Loading messages...</div>
      </div>

      <!-- Image Preview Container -->
      <div id="imagePreviewContainer" class="preview-bar hidden">
        <img id="imagePreview" src="" alt="preview" />
        <button id="cancelImageBtn" class="pill-btn danger" style="padding: 2px 8px; font-size: 0.75rem;">Remove</button>
      </div>

      <!-- Chat Input Area -->
      <form id="chatForm" class="chat-input-bar">
        <label for="chatFileInput" class="icon-btn" title="Attach Photo">
          📷
          <input type="file" id="chatFileInput" accept="image/*" hidden />
        </label>
        <textarea id="chatTextInput" rows="1" placeholder="Type a message..."></textarea>
        <button type="submit" class="send-btn" title="Send">➤</button>
      </form>
    </div>
  </section>

  <!-- DEBUG & BUG CHECK TAB -->
  <section id="debugTab" class="view-panel">
    <div class="card debug-card">
      <div class="debug-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h3 style="font-size: 1rem;">System Diagnostics</h3>
        <div style="display: flex; gap: 6px;">
          <button id="wipeAppCacheBtn" class="pill-btn" style="background: #e0e7ff; color: #4338ca;">Force Refresh</button>
          <button id="clearLogsBtn" class="pill-btn danger">Clear Logs</button>
        </div>
      </div>

      <!-- Automated One-Click Bug Checker -->
      <button id="runBugCheckBtn" class="primary-btn" style="margin-bottom: 12px; padding: 10px 14px; background: #059669; font-size: 0.88rem;">
        🧪 Run Automated Bug Check
      </button>

      <!-- Results of the Automated Test -->
      <div id="bugCheckResults" class="test-results-panel hidden"></div>

      <div style="font-size: 0.75rem; font-weight: 700; color: #64748b; margin: 8px 0 4px 0;">CONSOLE LOGS:</div>
      <div id="debugLogList" class="debug-list"></div>
    </div>
  </section>

  <!-- Profile Switcher Modal -->
  <div id="profileModal" class="modal hidden">
    <div class="modal-card">
      <h3>Select Your Identity</h3>
      <p style="color: #64748b; font-size: 0.85rem; margin-top: 4px;">Who is using this device right now?</p>
      <div class="profile-options">
        <button class="profile-choice" data-user="Brother">Brother (Downstairs)</button>
        <button class="profile-choice" data-user="Sister">Sister (Upstairs Room)</button>
      </div>
    </div>
  </div>

  <!-- Edit Message Modal -->
  <div id="editModal" class="modal hidden">
    <div class="modal-card">
      <h3>Edit Message</h3>
      <textarea id="editTextarea" rows="3" style="margin-top: 10px;"></textarea>
      <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px;">
        <button id="cancelEditBtn" class="pill-btn secondary">Cancel</button>
        <button id="saveEditBtn" class="pill-btn" style="background: #4f46e5; color: white;">Save Changes</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js?v=1.30"></script>
</body>
</html>
